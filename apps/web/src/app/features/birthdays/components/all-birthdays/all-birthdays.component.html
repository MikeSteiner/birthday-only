<section class="section-header">
    <h2 class="ds-h2">Your Birthdays</h2>
    <button class="btn-primary" (click)="add.emit()">+ Add Birthday</button>
</section>

@if (birthdays().length > 0) {
    <div class="birthdays-grid">
        @for (bd of birthdays(); track bd._id) {
            <app-birthday-action-card
                    [birthday]="bd">
                <button
                        class="btn-icon btn-icon--edit"
                        (click)="edit.emit(bd)"
                        aria-label="Edit birthday"
                >
                    ✏️
                </button>

                <button
                        class="btn-icon btn-icon--call"
                        (click)="call.emit(bd._id!)"
                        aria-label="Call"
                >
                    📞
                </button>

                <button
                        class="btn-icon btn-icon--delete"
                        (click)="remove.emit(bd._id!)"
                        aria-label="Delete birthday"
                >
                    🗑
                </button>
            </app-birthday-action-card>
        }
    </div>
} @else {
    <p class="empty-state">No birthdays yet. Add your first one 🎉</p>
}
