<section class="section-header">
    <h2 class="ds-h2">Your Birthdays</h2>
    <button class="btn-primary" (click)="add.emit()">
        <svg uiIcon="plus" class="icon"/> Add Birthday</button>
</section>

@let birthdaysValue = birthdays();
@if (birthdaysValue.length > 0) {
    <div class="birthdays-grid">
        @for (birthday of birthdaysValue; track birthday._id) {
            <app-birthday-action-card
                    [birthday]="birthday">

                <!-- Call -->
                <button class="btn-icon btn-icon--call"
                        (click)="call.emit(birthday._id!)"
                        aria-label="Call"
                >
                    <svg uiIcon="phone-arrow-up" class="icon call-icon"/>
                </button>

                <!-- Edit -->
                <button class="btn-icon btn-icon--edit"
                        (click)="edit.emit(birthday)"
                        aria-label="Edit birthday"
                >
                    <svg uiIcon="pencil-square" class="icon"/>
                </button>

                <!-- Delete -->
                <button class="btn-icon btn-icon--delete"
                        (click)="remove.emit(birthday._id!)"
                        aria-label="Delete birthday"
                >
                    <svg uiIcon="trash" class="icon delete-icon"/>

                </button>
            </app-birthday-action-card>
        }
    </div>
} @else {
    <p class="empty-state">No birthdays yet. Add your first one 🎉</p>
}
