@if (birthday()) {
    <div class="focus-card__content">
        <div class="focus-card__label">Next up</div>
        <h3 class="focus-card__name">{{ birthday()!.name | titlecase }}</h3>
        <div class="focus-card__meta">
            <svg uiIcon="cake" class="focus-card__empty-icon"></svg>
            <span>
                {{ birthday()!.birthMonth }} / {{ birthday()!.birthDay }}
                @if (birthday()!.birthYear) {
                    • Born {{ birthday()!.birthYear }}
                }
            </span>
        </div>
    </div>

    <button class="btn-primary focus-card__action-button">
        <svg uiIcon="phone-arrow-up" class="icon call-icon"/> Call
    </button>
} @else {
    <div class="focus-card__empty">
        <svg uiIcon="cake" class="focus-card__empty-icon"></svg>
        <p class="focus-card__empty-text">
            Select a birthday<br />
            and see details here
        </p>
    </div>
}
