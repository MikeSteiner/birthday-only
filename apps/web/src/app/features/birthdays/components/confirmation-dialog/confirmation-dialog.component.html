<div class="confirmation-dialog__header">
    <h2 class="confirmation-dialog__title">{{ title }}</h2>
</div>

<div class="confirmation-dialog__content">
    <p class="confirmation-dialog__message">{{ message }}</p>
</div>

<section class="confirmation-dialog__actions">
    <button type="button"
            class="btn-secondary"
            (click)="cancel()"
    >
        {{ cancelText }}
    </button>

    <button type="button"
            [class]="type === 'danger' ? 'btn-danger' : 'btn-primary'"
            (click)="confirm()"
    >
        {{ confirmText }}
    </button>
</section>
