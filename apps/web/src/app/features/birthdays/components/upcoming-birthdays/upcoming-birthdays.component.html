<section>
    <h2>Upcoming Birthdays</h2>
    @if (birthdays().length > 0) {
        <ul>

            @for (b of birthdays(); track b._id) {
                <li>
                    {{ b.name }} – {{ b.daysUntil }} days
                    @if (b.age) {
                        <span>({{ b.age }})</span>
                    }
                </li>
            }
        </ul>
    }
</section>
